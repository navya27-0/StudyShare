# StudyShare Production Docker Compose Specification
# Usage: docker compose -f infra/docker-compose.prod.yml up -d
# Requires environment variables or .env.production with strong credentials.

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyshare-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_DB: ${POSTGRES_DB:-studyshare_prod_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyshare} -d ${POSTGRES_DB:-studyshare_prod_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: studyshare-prod-backend
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      BACKEND_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-studyshare}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studyshare_prod_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://studyshare.pages.dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required in production}
      SCHEDULED_CLEANUP_ENABLED: "True"
      SECURITY_CLEANUP_INTERVAL_SECONDS: 21600
      LOGIN_ATTEMPT_RETENTION_HOURS: 24
    expose:
      - "8000"
    volumes:
      - backend_prod_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    # Single public ingress point and reverse proxy for SPA, /api/, and /uploads/
    # In production, edge TLS termination is handled upstream (e.g. Cloudflare, AWS ALB, Caddy, Traefik).
    # Nginx automatically inspects X-Forwarded-Proto and issues 301 redirects to HTTPS for unencrypted traffic.
    # IMPORTANT: The edge reverse proxy MUST overwrite client-supplied X-Forwarded-For, X-Forwarded-Proto,
    # and X-Real-IP headers with verified values from the TLS connection to prevent header spoofing.
    # Neither backend (8000) nor postgres (5432) publish host ports; all service traffic is internal to Docker.
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: studyshare-prod-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_prod_data:
  backend_prod_uploads:
