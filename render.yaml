services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: studyshare-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    preDeployCommand: "cd backend && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SCHEDULED_CLEANUP_ENABLED
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: studyshare-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://studyshare.pages.dev,https://studyshare-frontend.onrender.com"
      - key: REFRESH_COOKIE_SAMESITE
        value: "none"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: STORAGE_BACKEND
        value: s3
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: S3_BUCKET_NAME
        value: studyshare-academic-assets
      - key: S3_REGION_NAME
        value: us-east-1
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_DOMAIN
        sync: false
    disk:
      name: studyshare-uploads
      mountPath: /app/uploads
      sizeGB: 10

  # 3. Scheduled Database Backup Cron Job (Offsite Durable Storage)
  - type: cron
    name: studyshare-backup-cron
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.backup
    schedule: "0 2 * * *"  # Daily at 02:00 UTC
    dockerCommand: "bash /workspace/infra/backup.sh '' /tmp/backups"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studyshare-postgres
          property: connectionString
      - key: RETENTION_DAYS
        value: "14"
      - key: S3_BACKUP_BUCKET
        value: studyshare-academic-assets
      - key: BACKUP_S3_PREFIX
        value: database-backups
      - key: S3_REGION_NAME
        value: us-east-1
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false

  # 4. React 19 Frontend Static Site
  - type: static
    name: studyshare-frontend
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: VITE_API_URL
        fromService:
          name: studyshare-backend
          type: web
          property: host

databases:
  # Managed PostgreSQL 16
  # NOTE: 'plan: free' is intended for development, portfolio demonstrations, and CI evaluation.
  # Free tier databases on Render automatically expire/spin down after 30 days and do not include
  # point-in-time recovery (PITR) or automated host snapshots.
  # For permanent production reliability, upgrade to 'plan: starter' (or higher) to ensure persistent
  # storage and continuous database availability, while offsite S3 cron snapshots provide disaster recovery.
  - name: studyshare-postgres
    databaseName: studyshare_prod_db
    user: studyshare
    plan: free
