name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyshare
          POSTGRES_PASSWORD: studyshare_test
          POSTGRES_DB: studyshare_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check .

      - name: Run Ruff Format Check
        run: |
          cd backend
          ruff format --check .

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://studyshare:studyshare_test@localhost:5432/studyshare_test_db
        run: |
          cd backend
          alembic upgrade head

      - name: Seed Test Database
        env:
          DATABASE_URL: postgresql+asyncpg://studyshare:studyshare_test@localhost:5432/studyshare_test_db
        run: |
          cd backend
          python -m app.seed

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://studyshare:studyshare_test@localhost:5432/studyshare_test_db
          PYTHONPATH: .
        run: |
          cd backend
          pytest tests/ -v

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Check & Vite Build
        run: |
          cd frontend
          npm run build

  docker-ci:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configs
        run: |
          docker compose -f infra/docker-compose.yml config
          POSTGRES_PASSWORD=test_secret_pass JWT_SECRET_KEY=test_jwt_key docker compose -f infra/docker-compose.prod.yml config

      - name: Build Backend Image
        run: |
          docker build -t studyshare-backend:ci backend/

      - name: Build Frontend Image
        run: |
          docker build -t studyshare-frontend:ci frontend/
