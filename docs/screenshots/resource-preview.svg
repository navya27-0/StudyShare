  <rect x="845" y="258" width="142" height="34" class="btn-secondary"/>
  <text x="880" y="280" class="text-primary" font-size="12">▲ Upvote (48)</text>
  <rect x="998" y="258" width="142" height="34" class="btn-secondary"/>
  <text x="1030" y="280" class="text-primary" font-size="12">★ Rate (4.9 / 5)</text>

  <!-- Revision History Timeline Section -->
  <rect x="825" y="330" width="335" height="320" rx="6" class="surface"/>
  <text x="845" y="360" class="text-primary" font-size="14">Revision History &amp; Changelogs</text>

  <!-- v2 item -->
  <circle cx="855" cy="395" r="5" fill="#10b981"/>
  <text x="872" y="400" class="text-primary" font-size="13">Version 2 (Current)</text>
  <text x="872" y="420" class="text-mono">Updated Oct 18, 2026 by Arvind Raman</text>
  <text x="872" y="440" class="text-secondary" font-size="11">"Added missing double-rotation proof diagrams and unit exercise solutions."</text>

  <line x1="855" y1="405" x2="855" y2="475" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- v1 item -->
  <circle cx="855" cy="485" r="5" fill="#555555"/>
  <text x="872" y="490" class="text-secondary" font-size="13">Version 1 (Initial Release)</text>
  <text x="872" y="510" class="text-mono">Uploaded Sep 24, 2026</text>
  <text x="872" y="530" class="text-secondary" font-size="11">"Initial lecture notes covering standard BST insertions."</text>
  <text x="872" y="555" class="text-mono" fill="#60a5fa">Inspect v1 archive (1.9 MB)</text>
