              <text x="28" y="21" class="txt-sans" font-size="12" fill="#a1a1aa">↗ Share</text>
            </g>
          </g>
        </g>

        <!-- Rating & Syllabus Alignment Card -->
        <g transform="translate(0, 168)">
          <rect width="384" height="106" rx="8" fill="url(#prevCardGrad)" stroke="#27272a" stroke-width="1"/>
          <g transform="translate(18, 16)">
            <text x="0" y="12" class="txt-mono" font-size="10" font-weight="700" fill="#71717a">COMMUNITY PEER RATING</text>
            <!-- 5 Stars -->
            <g transform="translate(0, 24)">
              <text x="0" y="18" class="txt-sans" font-size="22" font-weight="700" fill="#ffffff">4.9</text>
              <text x="40" y="18" class="txt-sans" font-size="12" fill="#71717a">/ 5.0</text>
              <g transform="translate(86, 4)">
                <text x="0" y="13" fill="#f59e0b" font-size="14">★★★★★</text>
              </g>
              <text x="170" y="15" class="txt-mono" font-size="11" fill="#a1a1aa">(22 student reviews)</text>
            </g>

            <line x1="0" y1="52" x2="348" y2="52" stroke="#1f1f23" stroke-width="1"/>

            <g transform="translate(0, 68)">
              <text x="0" y="10" class="txt-mono" font-size="11" fill="#10b981">✓ 100% Core Syllabus Match</text>
              <text x="200" y="10" class="txt-mono" font-size="11" fill="#71717a">Clear Handwriting (A+)</text>
            </g>
          </g>
        </g>

        <!-- Version History & Revision Tree -->
        <g transform="translate(0, 290)">
          <rect width="384" height="254" rx="8" fill="url(#prevCardGrad)" stroke="#27272a" stroke-width="1"/>
          <g transform="translate(18, 18)">
            <text x="0" y="12" class="txt-sans txt-bold" font-size="13">Revision History &amp; Changelog</text>
            <text x="0" y="28" class="txt-mono" font-size="10" fill="#71717a">Full revision provenance recorded on ledger</text>

            <!-- Version 2 (Current) -->
            <g transform="translate(0, 48)">
              <circle cx="8" cy="8" r="5" fill="#10b981"/>
              <text x="22" y="12" class="txt-sans" font-size="12" font-weight="700" fill="#ffffff">Version 2.0 (Current Release)</text>
              <rect x="238" y="2" width="60" height="16" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
              <text x="246" y="13" class="txt-mono" font-size="9" font-weight="700" fill="#10b981">ACTIVE</text>
              <text x="22" y="30" class="txt-mono" font-size="10" fill="#71717a">Oct 18, 2026 • by Arvind Raman</text>
              <text x="22" y="48" class="txt-sans" font-size="11" fill="#d4d4d8">
                "Added double rotation LL/LR proof diagrams and 4 solved midterm questions."
              </text>
            </g>

            <!-- Connecting Dotted Line -->
            <line x1="8" y1="110" x2="8" y2="140" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3 3"/>

            <!-- Version 1 (Initial) -->
            <g transform="translate(0, 146)">
              <circle cx="8" cy="8" r="5" fill="#52525b"/>
              <text x="22" y="12" class="txt-sans" font-size="12" font-weight="600" fill="#a1a1aa">Version 1.0 (Initial Upload)</text>
              <text x="22" y="30" class="txt-mono" font-size="10" fill="#71717a">Sep 24, 2026 • 1.9 MB</text>
              <text x="22" y="48" class="txt-sans" font-size="11" fill="#71717a">
                "Original handwritten lecture notes covering standard BST insertions."
              </text>
              <text x="22" y="68" class="txt-mono" font-size="10" fill="#38bdf8">Inspect v1.0 snapshot ↗</text>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
