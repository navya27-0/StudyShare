<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%">
  <defs>
    <filter id="previewShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <linearGradient id="prevCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="docPaperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <style>
      .txt-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .txt-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .txt-serif { font-family: "Georgia", Cambria, "Times New Roman", Times, serif; }
      .txt-bold { font-weight: 700; fill: #ffffff; }
      .txt-sub { fill: #a1a1aa; font-size: 13px; }
      .txt-muted { fill: #71717a; font-size: 11px; }
    </style>
  </defs>

  <!-- Ambient Backdrop Canvas -->
  <rect width="1280" height="820" fill="#030303"/>
  <circle cx="640" cy="120" r="420" fill="#27272a" opacity="0.16" filter="blur(90px)"/>

  <!-- Desktop App Window Frame with Drop Shadow -->
  <g filter="url(#previewShadow)">
    <rect x="30" y="25" width="1220" height="770" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.2"/>

    <!-- Window Title Bar & Navigation Chrome -->
    <path d="M 30 37 Q 30 25 42 25 L 1238 25 Q 1250 25 1250 37 L 1250 68 L 30 68 Z" fill="#121215" stroke="#27272a" stroke-width="0.8"/>
    <!-- macOS Traffic Light Window Controls -->
    <circle cx="56" cy="46" r="6" fill="#ef4444"/>
    <circle cx="76" cy="46" r="6" fill="#f59e0b"/>
    <circle cx="96" cy="46" r="6" fill="#10b981"/>

    <!-- Address / Breadcrumb Bar -->
    <rect x="360" y="34" width="560" height="26" rx="6" fill="#09090b" stroke="#27272a"/>
    <circle cx="378" cy="47" r="3.5" fill="none" stroke="#71717a" stroke-width="1.2"/>
    <path d="M 378 41 L 378 44" stroke="#71717a" stroke-width="1.2"/>
    <text x="394" y="51" class="txt-sans txt-mono" font-size="11" fill="#a1a1aa">https://studyshare.edu/resources/14-avl-tree-rotations</text>

    <!-- Top App Navigation Header -->
    <g transform="translate(30, 68)">
      <rect width="1220" height="52" fill="#0d0d10" stroke="#1f1f23" stroke-width="1"/>
      <text x="24" y="32" class="txt-sans txt-bold" font-size="16" letter-spacing="2">STUDYSHARE</text>
      <text x="148" y="32" class="txt-mono" font-size="11" fill="#71717a">ACADEMIC LEDGER</text>

      <!-- Breadcrumbs in Top Bar -->
      <g transform="translate(320, 18)">
        <text x="0" y="14" class="txt-mono" font-size="11" fill="#71717a">&lt; ALL COURSES</text>
        <text x="96" y="14" class="txt-mono" font-size="11" fill="#3f3f46">/</text>
        <text x="110" y="14" class="txt-mono" font-size="11" fill="#a1a1aa">CS201 DATA STRUCTURES</text>
        <text x="272" y="14" class="txt-mono" font-size="11" fill="#3f3f46">/</text>
        <text x="286" y="14" class="txt-mono" font-size="11" fill="#38bdf8">UNIT 2: BALANCED TREES</text>
      </g>

      <!-- Back to Catalog & Bookmarks Pill -->
      <rect x="1086" y="11" width="108" height="30" rx="6" fill="#18181b" stroke="#27272a"/>
