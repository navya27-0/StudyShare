    </g>

    <!-- Main Viewport (700px height available) -->
    <g transform="translate(56, 134)">
      <!-- Resource Header Area -->
      <g>
        <g transform="translate(0, 4)">
          <rect width="90" height="20" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
          <text x="8" y="14" class="txt-mono" font-size="10" font-weight="700" fill="#818cf8">NOTES</text>

          <g transform="translate(98, 0)">
            <rect width="158" height="20" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="0.8"/>
            <circle cx="12" cy="10" r="3.5" fill="#10b981"/>
            <text x="22" y="14" class="txt-mono" font-size="10" font-weight="700" fill="#10b981">FACULTY VERIFIED</text>
          </g>

          <g transform="translate(264, 0)">
            <rect width="82" height="20" rx="4" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
            <text x="10" y="14" class="txt-mono" font-size="10" fill="#a1a1aa">SEMESTER 3</text>
          </g>

          <g transform="translate(354, 0)">
            <rect width="66" height="20" rx="4" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
            <text x="10" y="14" class="txt-mono" font-size="10" fill="#a1a1aa">REV v2.0</text>
          </g>
        </g>

        <!-- Document Main Title -->
        <text x="0" y="52" class="txt-sans txt-bold" font-size="22">CS201 Unit 2: Self-Balancing AVL Trees &amp; Rotations [Comprehensive Handwritten Notes]</text>
        <text x="0" y="74" class="txt-sans txt-sub" font-size="13">
          Contributed by <tspan fill="#ffffff" font-weight="600">Arvind Raman</tspan> (Dept of Computer Science) • 2.4 MB PDF (14 pages) • Last updated 2 days ago
        </text>
      </g>

      <!-- Main Two-Column Layout -->
      <!-- Left Column: Interactive PDF Viewer (760px wide) -->
      <g transform="translate(0, 92)">
        <rect width="760" height="544" rx="8" fill="#101014" stroke="#27272a" stroke-width="1"/>

        <!-- PDF Toolbar -->
        <rect width="760" height="38" rx="8" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
        <!-- Viewer Status -->
        <circle cx="20" cy="19" r="4" fill="#10b981"/>
        <text x="32" y="23" class="txt-mono" font-size="11" fill="#e4e4e7">DOCUMENT PREVIEW • PAGE 1 OF 14</text>

        <!-- Page Controls Center -->
        <g transform="translate(300, 7)">
          <rect width="24" height="24" rx="4" fill="#09090b" stroke="#27272a"/>
          <text x="8" y="16" class="txt-sans" font-size="12" fill="#a1a1aa">‹</text>
          <text x="34" y="16" class="txt-mono" font-size="11" fill="#ffffff">1 / 14</text>
          <rect x="76" y="0" width="24" height="24" rx="4" fill="#09090b" stroke="#27272a"/>
          <text x="84" y="16" class="txt-sans" font-size="12" fill="#a1a1aa">›</text>
        </g>

        <!-- Zoom & Expand Tools Right -->
        <g transform="translate(560, 7)">
          <rect width="56" height="24" rx="4" fill="#09090b" stroke="#27272a"/>
          <text x="10" y="16" class="txt-mono" font-size="10" fill="#a1a1aa">100%</text>
          <rect x="62" y="0" width="60" height="24" rx="4" fill="#09090b" stroke="#27272a"/>
          <text x="70" y="16" class="txt-sans" font-size="10" fill="#e4e4e7">Zoom +</text>
          <rect x="128" y="0" width="62" height="24" rx="4" fill="#09090b" stroke="#27272a"/>
          <text x="136" y="16" class="txt-sans" font-size="10" fill="#e4e4e7">Full ⛶</text>
        </g>

        <!-- Simulated Crisp White Document Canvas -->
        <g transform="translate(24, 52)">
          <rect width="712" height="472" rx="4" fill="url(#docPaperGrad)" stroke="#e2e8f0" stroke-width="1"/>

          <!-- Document Header -->
          <text x="36" y="44" class="txt-serif" font-size="20" font-weight="700" fill="#0f172a">CS201 Data Structures — Lecture 14: AVL Trees</text>
          <text x="36" y="66" class="txt-sans" font-size="12" fill="#64748b">Topic: Balance Factor, Tree Invariants &amp; All 4 Rotations Cases (LL, RR, LR, RL)</text>
          <line x1="36" y1="80" x2="676" y2="80" stroke="#cbd5e1" stroke-width="1"/>

          <!-- Theorem Callout Box -->
          <rect x="36" y="96" width="640" height="52" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
          <text x="50" y="116" class="txt-mono" font-size="11" font-weight="700" fill="#0f172a">THEOREM 4.1 (AVL HEIGHT BOUND)</text>
          <text x="50" y="134" class="txt-serif" font-size="12.5" fill="#334155">
            An AVL tree with N nodes maintains a maximum height h &lt; 1.4404 · log₂(N + 2) − 0.328. Search is strictly O(log N).
          </text>

          <!-- Rotations Diagram Illustration -->
          <g transform="translate(36, 168)">
            <!-- Case 1 Container -->
            <rect width="308" height="184" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
            <text x="14" y="24" class="txt-mono" font-size="11" font-weight="700" fill="#0284c7">CASE 1: LEFT-LEFT (LL) ROTATION</text>
            <text x="14" y="40" class="txt-sans" font-size="10" fill="#64748b">Trigger: BF(Node 30) = +2 and BF(Node 20) = +1</text>

            <!-- Unbalanced Tree (Before) -->
            <g transform="translate(30, 56)">
              <!-- Node 30 -->
              <circle cx="60" cy="20" r="14" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
              <text x="52" y="24" class="txt-mono" font-size="11" font-weight="700" fill="#0f172a">30</text>
              <text x="80" y="22" class="txt-mono" font-size="9" fill="#ef4444">BF=+2</text>

              <!-- Left Branch to 20 -->
              <line x1="50" y1="30" x2="26" y2="54" stroke="#0f172a" stroke-width="1.5"/>
              <circle cx="20" cy="62" r="13" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
              <text x="13" y="66" class="txt-mono" font-size="11" font-weight="700" fill="#0f172a">20</text>
              <text x="36" y="64" class="txt-mono" font-size="9" fill="#ef4444">BF=+1</text>

              <!-- Left Branch to 10 -->
              <line x1="14" y1="74" x2="2" y2="94" stroke="#0f172a" stroke-width="1.5"/>
              <circle cx="0" cy="104" r="11" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
              <text x="-6" y="108" class="txt-mono" font-size="10" font-weight="700" fill="#0f172a">10</text>
            </g>

            <!-- Transformation Arrow -->
            <g transform="translate(144, 94)">
              <line x1="0" y1="12" x2="24" y2="12" stroke="#0284c7" stroke-width="2"/>
              <polygon points="24,8 30,12 24,16" fill="#0284c7"/>
              <text x="-6" y="28" class="txt-mono" font-size="9" fill="#0284c7">RightRotate(30)</text>
            </g>

            <!-- Balanced Subtree (After) -->
            <g transform="translate(216, 56)">
              <!-- New Root 20 -->
              <circle cx="44" cy="24" r="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
              <text x="37" y="28" class="txt-mono" font-size="11" font-weight="700" fill="#065f46">20</text>
              <text x="64" y="26" class="txt-mono" font-size="9" fill="#10b981">BF=0</text>

              <!-- Left Child 10 -->
              <line x1="34" y1="34" x2="18" y2="58" stroke="#0f172a" stroke-width="1.5"/>
              <circle cx="12" cy="66" r="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
              <text x="6" y="70" class="txt-mono" font-size="10" font-weight="700" fill="#0f172a">10</text>

              <!-- Right Child 30 -->
              <line x1="54" y1="34" x2="70" y2="58" stroke="#0f172a" stroke-width="1.5"/>
              <circle cx="76" cy="66" r="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
              <text x="70" y="70" class="txt-mono" font-size="10" font-weight="700" fill="#0f172a">30</text>
            </g>
          </g>

          <!-- Case 2 Container: LR Rotation -->
          <g transform="translate(360, 168)">
            <rect width="316" height="184" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
            <text x="14" y="24" class="txt-mono" font-size="11" font-weight="700" fill="#d97706">CASE 2: LEFT-RIGHT (LR) DOUBLE ROTATION</text>
            <text x="14" y="40" class="txt-sans" font-size="10" fill="#64748b">Inner skew resolved by RotateLeft(child) then RotateRight(parent)</text>

            <rect x="14" y="56" width="288" height="60" rx="4" fill="#fffbeb" stroke="#fef3c7"/>
            <text x="24" y="76" class="txt-serif" font-size="12" fill="#92400e">
              Step 1: RotateLeft on node 10 transforms structure into LL pattern.
            </text>
            <text x="24" y="98" class="txt-serif" font-size="12" fill="#92400e">
              Step 2: RotateRight on node 30 restores strict height balance (O(1)).
            </text>

            <text x="14" y="146" class="txt-mono" font-size="10" font-weight="700" fill="#0f172a">ALGORITHM COMPLEXITY: O(1) RE-LINKING</text>
            <text x="14" y="164" class="txt-sans" font-size="10.5" fill="#64748b">Only 3 pointer mutations required per rebalance step.</text>
          </g>

          <!-- Exam Highlight Footnote -->
          <rect x="36" y="372" width="640" height="54" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="48" y="392" class="txt-mono" font-size="10.5" font-weight="700" fill="#e11d48">★ SEMESTER EXAM NOTE:</text>
          <text x="48" y="412" class="txt-sans" font-size="11.5" fill="#334155">
            Always write balance factors next to every node in exam derivations. Partial marks are awarded for identifying the deepest unbalanced node.
          </text>
        </g>
      </g>

      <!-- Right Column: Sidebar Actions, Ratings & Version Tree (390px wide) -->
      <g transform="translate(784, 92)">
        <!-- Download & Primary Action Card -->
        <rect width="384" height="152" rx="8" fill="url(#prevCardGrad)" stroke="#27272a" stroke-width="1"/>
        <g transform="translate(18, 18)">
          <text x="0" y="14" class="txt-sans txt-bold" font-size="14">Actions &amp; Trust Index</text>

          <!-- Download Button -->
          <g transform="translate(0, 26)">
            <rect width="348" height="42" rx="6" fill="#ffffff"/>
            <text x="96" y="26" class="txt-sans" font-size="13" font-weight="700" fill="#000000">⬇ Download PDF (2.4 MB)</text>
          </g>

          <!-- Action Pill Row -->
          <g transform="translate(0, 78)">
            <!-- Upvote Button -->
            <rect width="110" height="34" rx="6" fill="#18181b" stroke="#27272a"/>
