              <text x="0" y="44" class="txt-sans txt-bold" font-size="14" fill="#0f172a">Unit 2 AVL Rotations &amp; Proofs</text>
              <text x="0" y="62" class="txt-sans" font-size="11.5" fill="#64748b">Handwritten derivations • 14 pages PDF</text>

              <line x1="0" y1="78" x2="296" y2="78" stroke="#f1f5f9" stroke-width="1"/>

              <text x="0" y="98" fill="#d97706" font-size="12">★★★★★</text>
              <text x="62" y="98" class="txt-mono" font-size="11" fill="#0f172a">4.9</text>
              <text x="86" y="98" class="txt-mono" font-size="11" fill="#64748b">(22)</text>
              <text x="210" y="98" class="txt-mono" font-size="11" fill="#059669">▲ 48 upvotes</text>
            </g>
          </g>

          <!-- Resource Card 2 in Light Mode -->
          <g transform="translate(0, 204)">
            <rect width="324" height="136" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
            <g transform="translate(14, 14)">
              <rect width="44" height="18" rx="3" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
              <text x="6" y="13" class="txt-mono" font-size="9.5" font-weight="700" fill="#b45309">PYQ</text>

              <g transform="translate(50, 0)">
                <rect width="84" height="18" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8"/>
                <text x="8" y="13" class="txt-mono" font-size="9.5" fill="#64748b">MIDTERM 2024</text>
              </g>

              <text x="0" y="44" class="txt-sans txt-bold" font-size="14" fill="#0f172a">2024 Midterm Solved Paper</text>
              <text x="0" y="62" class="txt-sans" font-size="11.5" fill="#64748b">All 6 questions with stepwise marking</text>

              <line x1="0" y1="78" x2="296" y2="78" stroke="#f1f5f9" stroke-width="1"/>

              <text x="0" y="98" fill="#d97706" font-size="12">★★★★★</text>
              <text x="62" y="98" class="txt-mono" font-size="11" fill="#0f172a">4.8</text>
              <text x="86" y="98" class="txt-mono" font-size="11" fill="#64748b">(17)</text>
              <text x="210" y="98" class="txt-mono" font-size="11" fill="#059669">▲ 34 upvotes</text>
            </g>
          </g>

          <!-- Feature Badge -->
          <g transform="translate(0, 360)">
            <rect width="324" height="42" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
            <text x="14" y="26" class="txt-mono" font-size="11" font-weight="700" fill="#0f172a">Anti-Glare: Slate Paper (#F8FAFC)</text>
          </g>
        </g>
      </g>

      <!-- Panel 3: Low-Bandwidth Campus Lite Mode (364px wide) -->
      <g transform="translate(796, 0)" filter="url(#themeShadow)">
        <rect width="364" height="570" rx="10" fill="#09090b" stroke="#27272a" stroke-width="1.2"/>

        <!-- Window Header -->
        <path d="M 0 10 Q 0 0 10 0 L 354 0 Q 364 0 364 10 L 364 42 L 0 42 Z" fill="#141417" stroke="#27272a" stroke-width="0.8"/>
        <circle cx="20" cy="21" r="5" fill="#10b981"/>
        <text x="36" y="25" class="txt-mono" font-size="11" font-weight="700" fill="#10b981">CAMPUS LITE (OFFLINE READY)</text>

        <!-- Panel Body -->
        <g transform="translate(20, 60)">
          <text x="0" y="16" class="txt-sans txt-bold" font-size="16" fill="#ffffff">Hostel Wi-Fi Resilient</text>
          <text x="0" y="34" class="txt-sans" font-size="12" fill="#71717a">
            Disables heavy animations and backdrop filters; uses IndexedDB offline caching for instantaneous local lookup.
          </text>

          <!-- Offline Cached Items List -->
          <g transform="translate(0, 52)">
            <!-- Item 1 -->
            <rect width="324" height="56" rx="4" fill="#101014" stroke="#27272a" stroke-width="1"/>
            <text x="12" y="24" class="txt-sans" font-size="12" font-weight="600" fill="#ffffff">1. CS201 Unit 2 AVL Notes [2.4 MB]</text>
            <rect x="12" y="32" width="132" height="16" rx="2" fill="rgba(16, 185, 129, 0.15)"/>
            <text x="18" y="44" class="txt-mono" font-size="9" font-weight="700" fill="#10b981">CACHED IN OFFLINE DB</text>

            <!-- Item 2 -->
            <g transform="translate(0, 66)">
              <rect width="324" height="56" rx="4" fill="#101014" stroke="#27272a" stroke-width="1"/>
              <text x="12" y="24" class="txt-sans" font-size="12" font-weight="600" fill="#ffffff">2. CS201 Midterm Solutions [1.1 MB]</text>
              <rect x="12" y="32" width="132" height="16" rx="2" fill="rgba(16, 185, 129, 0.15)"/>
              <text x="18" y="44" class="txt-mono" font-size="9" font-weight="700" fill="#10b981">CACHED IN OFFLINE DB</text>
            </g>

            <!-- Item 3 -->
            <g transform="translate(0, 132)">
              <rect width="324" height="56" rx="4" fill="#101014" stroke="#27272a" stroke-width="1"/>
              <text x="12" y="24" class="txt-sans" font-size="12" font-weight="600" fill="#ffffff">3. CS201 Lab 4 Balanced Tree Code</text>
              <rect x="12" y="32" width="110" height="16" rx="2" fill="#18181b"/>
              <text x="18" y="44" class="txt-mono" font-size="9" fill="#a1a1aa">BOOKMARKED LOCALLY</text>
            </g>

            <!-- Item 4 -->
            <g transform="translate(0, 198)">
              <rect width="324" height="56" rx="4" fill="#101014" stroke="#27272a" stroke-width="1"/>
              <text x="12" y="24" class="txt-sans" font-size="12" font-weight="600" fill="#ffffff">4. Full Curriculum Syllabus Hierarchy</text>
              <rect x="12" y="32" width="132" height="16" rx="2" fill="rgba(16, 185, 129, 0.15)"/>
              <text x="18" y="44" class="txt-mono" font-size="9" font-weight="700" fill="#10b981">ZERO NETWORK PAYLOAD</text>
            </g>
          </g>

          <!-- Feature Badge -->
          <g transform="translate(0, 360)">
            <rect width="324" height="42" rx="6" fill="#141417" stroke="#27272a"/>
            <text x="14" y="26" class="txt-mono" font-size="11" font-weight="700" fill="#38bdf8">Payload Transfer: 0 KB (IndexedDB)</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Bottom Telemetry Summary Matrix Bar -->
    <g transform="translate(0, 670)">
      <rect width="1160" height="44" rx="6" fill="#0d0d10" stroke="#1f1f23" stroke-width="1"/>
      <g transform="translate(24, 27)">
        <text x="0" y="0" class="txt-mono" font-size="11" fill="#10b981">✓ WCAG 2.1 AA Certified</text>
        <text x="210" y="0" class="txt-mono" font-size="11" fill="#ffffff">• 21:1 OLED Max Contrast</text>
        <text x="440" y="0" class="txt-mono" font-size="11" fill="#ffffff">• Cumulative Layout Shift (CLS) &lt; 0.02</text>
        <text x="760" y="0" class="txt-mono" font-size="11" fill="#ffffff">• 100% Keyboard Navigable</text>
        <text x="980" y="0" class="txt-mono" font-size="11" fill="#38bdf8">• 0ms Offline Cache</text>
      </g>
    </g>
  </g>
</svg>
