<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%">
  <defs>
    <filter id="themeShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <style>
      .txt-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .txt-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .txt-bold { font-weight: 700; }
    </style>
  </defs>

  <!-- Ambient Backdrop Canvas -->
  <rect width="1280" height="820" fill="#030303"/>
  <circle cx="640" cy="100" r="450" fill="#27272a" opacity="0.14" filter="blur(90px)"/>

  <!-- Top App Navigation Chrome -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" class="txt-sans txt-bold" font-size="24" fill="#ffffff">Adaptive Campus Modes &amp; Architectural Themes</text>
    <text x="0" y="48" class="txt-sans" font-size="13" fill="#a1a1aa">
      Engineered for university lecture halls, late-night hostel cramming, and unreliable campus Wi-Fi.
    </text>

    <!-- 3 Campus Mode Cards -->
    <g transform="translate(0, 76)">
      <!-- Panel 1: Pitch Black OLED Mode (364px wide) -->
      <g filter="url(#themeShadow)">
        <rect width="364" height="570" rx="10" fill="#000000" stroke="#27272a" stroke-width="1.2"/>

        <!-- Window Header -->
        <path d="M 0 10 Q 0 0 10 0 L 354 0 Q 364 0 364 10 L 364 42 L 0 42 Z" fill="#0a0a0c" stroke="#27272a" stroke-width="0.8"/>
        <circle cx="20" cy="21" r="5" fill="#ef4444"/>
        <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
        <circle cx="52" cy="21" r="5" fill="#10b981"/>
        <text x="74" y="25" class="txt-mono" font-size="11" font-weight="700" fill="#ffffff">OLED PITCH BLACK (DEFAULT)</text>

        <!-- Panel Body -->
        <g transform="translate(20, 60)">
          <text x="0" y="16" class="txt-sans txt-bold" font-size="16" fill="#ffffff">CS201 Data Structures</text>
          <text x="0" y="34" class="txt-sans" font-size="12" fill="#71717a">
            True #000000 black preserves battery and minimizes eye fatigue during late night revision.
          </text>

          <!-- Resource Card 1 in Dark Mode -->
          <g transform="translate(0, 52)">
            <rect width="324" height="136" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
            <g transform="translate(14, 14)">
              <!-- Tags -->
              <rect width="52" height="18" rx="3" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
              <text x="6" y="13" class="txt-mono" font-size="9.5" font-weight="700" fill="#818cf8">NOTES</text>

              <g transform="translate(58, 0)">
                <rect width="118" height="18" rx="3" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="0.8"/>
                <circle cx="8" cy="9" r="3" fill="#10b981"/>
                <text x="16" y="13" class="txt-mono" font-size="9.5" font-weight="700" fill="#10b981">FACULTY VERIFIED</text>
              </g>

              <!-- Title -->
              <text x="0" y="44" class="txt-sans txt-bold" font-size="14" fill="#ffffff">Unit 2 AVL Rotations &amp; Proofs</text>
              <text x="0" y="62" class="txt-sans" font-size="11.5" fill="#a1a1aa">Handwritten derivations • 14 pages PDF</text>

              <line x1="0" y1="78" x2="296" y2="78" stroke="#1f1f23" stroke-width="1"/>

              <!-- Metrics -->
              <text x="0" y="98" fill="#f59e0b" font-size="12">★★★★★</text>
              <text x="62" y="98" class="txt-mono" font-size="11" fill="#ffffff">4.9</text>
              <text x="86" y="98" class="txt-mono" font-size="11" fill="#71717a">(22)</text>
              <text x="210" y="98" class="txt-mono" font-size="11" fill="#10b981">▲ 48 upvotes</text>
            </g>
          </g>

          <!-- Resource Card 2 in Dark Mode -->
          <g transform="translate(0, 204)">
            <rect width="324" height="136" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
            <g transform="translate(14, 14)">
              <rect width="44" height="18" rx="3" fill="#312e81" stroke="#4f46e5" stroke-width="0.8"/>
              <text x="6" y="13" class="txt-mono" font-size="9.5" font-weight="700" fill="#a5b4fc">PYQ</text>

              <g transform="translate(50, 0)">
                <rect width="84" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="0.8"/>
                <text x="8" y="13" class="txt-mono" font-size="9.5" fill="#a1a1aa">MIDTERM 2024</text>
              </g>

              <text x="0" y="44" class="txt-sans txt-bold" font-size="14" fill="#ffffff">2024 Midterm Solved Paper</text>
              <text x="0" y="62" class="txt-sans" font-size="11.5" fill="#a1a1aa">All 6 questions with stepwise marking</text>

              <line x1="0" y1="78" x2="296" y2="78" stroke="#1f1f23" stroke-width="1"/>

              <text x="0" y="98" fill="#f59e0b" font-size="12">★★★★★</text>
              <text x="62" y="98" class="txt-mono" font-size="11" fill="#ffffff">4.8</text>
              <text x="86" y="98" class="txt-mono" font-size="11" fill="#71717a">(17)</text>
              <text x="210" y="98" class="txt-mono" font-size="11" fill="#10b981">▲ 34 upvotes</text>
            </g>
          </g>

          <!-- Feature Badge -->
          <g transform="translate(0, 360)">
            <rect width="324" height="42" rx="6" fill="#0c0c0e" stroke="#27272a"/>
            <text x="14" y="26" class="txt-mono" font-size="11" font-weight="700" fill="#10b981">Contrast Ratio: 21:1 (WCAG AAA Max)</text>
          </g>
        </g>
      </g>

      <!-- Panel 2: Daylight Paper Mode (364px wide) -->
      <g transform="translate(398, 0)" filter="url(#themeShadow)">
        <rect width="364" height="570" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

        <!-- Window Header -->
        <path d="M 0 10 Q 0 0 10 0 L 354 0 Q 364 0 364 10 L 364 42 L 0 42 Z" fill="#edf2f7" stroke="#cbd5e1" stroke-width="0.8"/>
        <circle cx="20" cy="21" r="5" fill="#cbd5e1"/>
        <circle cx="36" cy="21" r="5" fill="#cbd5e1"/>
        <circle cx="52" cy="21" r="5" fill="#cbd5e1"/>
        <text x="74" y="25" class="txt-mono" font-size="11" font-weight="700" fill="#0f172a">DAYLIGHT PAPER MODE</text>

        <!-- Panel Body -->
        <g transform="translate(20, 60)">
          <text x="0" y="16" class="txt-sans txt-bold" font-size="16" fill="#0f172a">CS201 Data Structures</text>
          <text x="0" y="34" class="txt-sans" font-size="12" fill="#64748b">
            Crisp matte paper palette calibrated for brightly lit campus reading rooms and lecture halls.
          </text>

          <!-- Resource Card 1 in Light Mode -->
          <g transform="translate(0, 52)">
            <rect width="324" height="136" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
            <g transform="translate(14, 14)">
              <rect width="52" height="18" rx="3" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="0.8"/>
              <text x="6" y="13" class="txt-mono" font-size="9.5" font-weight="700" fill="#4338ca">NOTES</text>

              <g transform="translate(58, 0)">
                <rect width="118" height="18" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
                <circle cx="8" cy="9" r="3" fill="#059669"/>
                <text x="16" y="13" class="txt-mono" font-size="9.5" font-weight="700" fill="#065f46">FACULTY VERIFIED</text>
