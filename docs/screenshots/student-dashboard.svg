      .txt-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .txt-bold { font-weight: 700; fill: #ffffff; }
      .txt-reg { fill: #a1a1aa; font-size: 13px; }
      .txt-dim { fill: #71717a; font-size: 11px; }
    </style>
  </defs>

  <!-- Dark Ambient Canvas -->
  <rect width="1280" height="820" fill="#030303"/>
  <circle cx="640" cy="80" r="400" fill="#27272a" opacity="0.18" filter="blur(80px)"/>

